<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>商品一覧</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>thr shop </h1>

    <div class="products">

        <div class="product">
          <img src="imagesthrtee1.jpg" onclick="openImage(this.src)">
            <h2>thr one point TEE</h2>
            <p>¥8,800</p>
            <a href="product1.html">商品を見る</a>
        </div>

        <div class="product">
            <img src="imagesthrtee2.jpg" onclick="openImage(this.src)">
            <h2>thr one point TEE</h2>
            <p>¥8,800</p>
            <a href="product2.html">商品を見る</a>
        </div>

    </div>
<div id="imageModal" onclick="closeImage()">
    <img id="bigImage">
</div>

<script>
function openImage(src) {
    document.getElementById("bigImage").src = src;
    document.getElementById("imageModal").style.display = "flex";
}

function closeImage() {
    document.getElementById("imageModal").style.display = "none";
}
</script>
</body>
</html>
<style>
/* スマホ用 */
@media (max-width: 600px) {
    body {
        background-image: url("background2.jpg");
        background-attachment: scroll;
        background-position: center;
    }
}
body {
    margin: 0;
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}
.product img {
    width: 500px;
    height: auto;
}
#imageModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

#imageModal img {
    max-width: 90%;
    max-height: 90%;
}
.product img {
    width: 250px;
    max-width: 100%;
    height: auto;
}
@media (max-width: 600px) {
    .products {
        display: block;
    }

    .product {
        margin: 20px;
    }

    .product img {
        width: 200px;
    }

    h1 {
        font-size: 32px;
    }
}
